name: Scrape AMVGG pet values

on:
  schedule:
    # Every 6 hours (UTC). Minute 17 avoids the busy top-of-hour queue.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      inspect:
        description: "Only inspect the page markup (uploads inspect-report.txt); do not scrape or commit"
        type: boolean
        default: false

# Needed so the built-in GITHUB_TOKEN can push the updated data files.
permissions:
  contents: write

# Never run two scrapes at once (avoids push races).
concurrency:
  group: amvgg-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSPECT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.inspect }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inspect page markup (manual runs with inspect=true)
        if: env.INSPECT_ONLY == 'true'
        run: python scraper.py --inspect

      - name: Upload inspection report
        if: always() && env.INSPECT_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: inspect-report
          path: inspect-report.txt
          if-no-files-found: warn

      - name: Run scraper
        if: env.INSPECT_ONLY != 'true'
        run: python scraper.py

      - name: Commit and push changes (only if something changed)
        if: env.INSPECT_ONLY != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "chore(data): update AMVGG pet values"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
